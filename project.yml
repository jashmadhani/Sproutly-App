name: Sproutly

# APP IDENTITY — settled, and effectively permanent. A bundle ID is fixed once
# an app record exists in App Store Connect (changing it means a new record and
# the loss of reviews and ranking), and an IAP product ID is fixed once that
# product exists and cannot be reused even after deletion. Treat both as final.
#
# The bundle ID is public: Apple's iTunes Lookup API returns it for any app with
# no authentication, so it carries the product's name rather than a personal one.
#
# Occurrences that must stay in sync: this prefix, both PRODUCT_BUNDLE_IDENTIFIERs
# below, `productID` in Sproutly.storekit, `PurchaseManager.productID`, and the
# assertion in PurchaseManagerTests that holds those last two together.

options:
  bundleIdPrefix: com.sproutly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: FDYHXN3XSH
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Sproutly:
    type: application
    platform: iOS
    sources:
      - path: Sproutly
    settings:
      base:
        PRODUCT_NAME: Sproutly
        PRODUCT_BUNDLE_IDENTIFIER: com.sproutly.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

        # iPhone only, portrait only — matches the .swiftpm Package.swift
        TARGETED_DEVICE_FAMILY: "1"

        # Asset catalog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

        # Alternate app icons (Pro feature). Xcode generates the
        # CFBundleIcons/CFBundleAlternateIcons plist entries from these two
        # settings, which is why they live here and not in a checked-in
        # Info.plist. The names must match the .appiconset folder names
        # exactly — a typo fails silently at runtime with setAlternateIconName
        # returning an error rather than a build failure.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconSprout AppIconTwin AppIconNight AppIconBlossom
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

        # Info.plist is generated from these keys (modern Xcode style —
        # no checked-in Info.plist to drift out of sync).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sproutly
        # Sproutly makes no network calls and uses no encryption beyond what iOS
        # applies to its own storage, which is exempt. Without this key App Store
        # Connect blocks every upload on a manual export-compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

        # Required before any photo access. Missing it is a launch-time crash and
        # an App Review rejection. PhotosPicker itself is out-of-process and does
        # not strictly require it, but the string must exist the moment any code
        # path touches the library.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Sproutly lets you attach a photo to a milestone. Your photos stay on this device and are never uploaded."

  SproutlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SproutlyTests
      - path: Sproutly.storekit
        buildPhase: resources
    dependencies:
      - target: Sproutly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sproutly.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sproutly:
    build:
      targets:
        Sproutly: all
    run:
      config: Debug
      # Local StoreKit testing — purchases work in the simulator with no sandbox
      # account. This file is for development only; App Store Connect is the
      # source of truth in production.
      storeKitConfiguration: Sproutly.storekit
    test:
      config: Debug
      targets:
        - SproutlyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
