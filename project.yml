name: Sproutly

options:
  bundleIdPrefix: com.jashmadhani
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: FDYHXN3XSH
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Sproutly:
    type: application
    platform: iOS
    sources:
      - path: Sproutly
    settings:
      base:
        PRODUCT_NAME: Sproutly
        PRODUCT_BUNDLE_IDENTIFIER: com.jashmadhani.Sproutly
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

        # iPhone only, portrait only — matches the .swiftpm Package.swift
        TARGETED_DEVICE_FAMILY: "1"

        # Asset catalog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

        # Info.plist is generated from these keys (modern Xcode style —
        # no checked-in Info.plist to drift out of sync).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sproutly
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  SproutlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SproutlyTests
    dependencies:
      - target: Sproutly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jashmadhani.Sproutly.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sproutly:
    build:
      targets:
        Sproutly: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SproutlyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
