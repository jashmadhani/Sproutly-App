name: Sproutly

options:
  bundleIdPrefix: com.jashmadhani
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: FDYHXN3XSH
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Sproutly:
    type: application
    platform: iOS
    sources:
      - path: Sproutly
    settings:
      base:
        PRODUCT_NAME: Sproutly
        PRODUCT_BUNDLE_IDENTIFIER: com.jashmadhani.Sproutly
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

        # iPhone only, portrait only — matches the .swiftpm Package.swift
        TARGETED_DEVICE_FAMILY: "1"

        # Asset catalog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

        # Alternate app icons (Pro feature). Xcode generates the
        # CFBundleIcons/CFBundleAlternateIcons plist entries from these two
        # settings, which is why they live here and not in a checked-in
        # Info.plist. The names must match the .appiconset folder names
        # exactly — a typo fails silently at runtime with setAlternateIconName
        # returning an error rather than a build failure.
        # Re-enable once the icon art lands. Listing a name with no matching
        # .appiconset fails the asset-catalog build, so this stays commented
        # until the folders exist.
        # ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconSprout AppIconTwin AppIconNight AppIconSage
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

        # Info.plist is generated from these keys (modern Xcode style —
        # no checked-in Info.plist to drift out of sync).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sproutly
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

        # Required before any photo access. Missing it is a launch-time crash and
        # an App Review rejection. PhotosPicker itself is out-of-process and does
        # not strictly require it, but the string must exist the moment any code
        # path touches the library.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Sproutly lets you attach a photo to a milestone. Your photos stay on this device and are never uploaded."

  SproutlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SproutlyTests
      - path: Sproutly.storekit
        buildPhase: resources
    dependencies:
      - target: Sproutly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jashmadhani.Sproutly.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sproutly:
    build:
      targets:
        Sproutly: all
    run:
      config: Debug
      # Local StoreKit testing — purchases work in the simulator with no sandbox
      # account. This file is for development only; App Store Connect is the
      # source of truth in production.
      storeKitConfiguration: Sproutly.storekit
    test:
      config: Debug
      targets:
        - SproutlyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
